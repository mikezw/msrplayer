# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: 10.0
        
    - name: restore dependencies
      # 无 RID 恢复（为构建/测试提供基础 assets）；各架构的 RID 由 publish 隐式 restore 补齐
      run: dotnet restore
      
    - name: test
      run: dotnet test --no-restore

    - name: install vpk
      if: github.ref_type == 'tag'
      run: dotnet tool install --global vpk --version 1.2.0

    # 发布两个 Windows 架构（win-x64 / win-arm64），用独立 channel 区分产物命名
    # 每个架构：拉上一版生成增量包 → 打包 → 安装包重命名（带架构+版本）→ 生成 SHA256
    - name: publish and pack
      if: github.ref_type == 'tag'
      run: |
        set -e
        export PATH="$PATH:$HOME/.dotnet/tools"
        VERSION=${GITHUB_REF_NAME#v}
        for SPEC in "win-x64:win" "win-arm64:win-arm64"; do
          RID=${SPEC%%:*}
          CHANNEL=${SPEC##*:}

          # publish 不带 --no-restore：SDK 会为当前 RID 自动补齐 assets（连续 restore -r 会互相覆盖，不可依赖）
          dotnet publish MsrPlayer/MsrPlayer.csproj -o:release/$RID -r:$RID -p:Version=${VERSION}

          # 拉取上一版本产物用于生成增量更新包；首次发布（无上一版本）时忽略失败
          vpk download github --repoUrl https://github.com/mikezw/msrplayer -c ${CHANNEL} || true

          # 代码签名（可选）：准备好证书后，在 pack 命令追加签名参数
          #   Azure Trusted Signing: --azureTrustedSignFile <metadata.json>
          #   已有证书: --signTemplate "signtool sign /f <cert.pfx> /p <密码> {{file}}"
          # 注意：runner 是 Linux，打包 Windows 包必须用 OS 指令 [win]（System.CommandLine directive，方括号语法；
          # 无指令时目标 OS 默认为当前系统，直接 vpk pack 会报 "target rid must be Linux"）
          # --msi --instLocation Either：额外生成 MSI 安装包，安装时用户可选择 PerUser/PerMachine
          vpk '[win]' pack --packId MsrPlayer --packVersion ${VERSION} --packDir release/$RID --packTitle "Monster Siren Player" --mainExe MsrPlayer.exe --icon MsrPlayer/Assets/music-icon.ico --runtime ${RID} --channel ${CHANNEL} --msi --instLocation Either

          # 安装包重命名（带架构+版本后缀），便于用户识别；不影响自动更新（更新源只引用 nupkg）
          mv Releases/MsrPlayer-${CHANNEL}-Setup.exe Releases/MsrPlayer-${RID}-${VERSION}-Setup.exe
          mv Releases/MsrPlayer-${CHANNEL}.msi Releases/MsrPlayer-${RID}-${VERSION}.msi

          # 仅对安装文件（Setup.exe / MSI）生成 SHA256 校验值
          (cd Releases && sha256sum MsrPlayer-${RID}-${VERSION}-Setup.exe > MsrPlayer-${RID}-${VERSION}-Setup.exe.sha256)
          (cd Releases && sha256sum MsrPlayer-${RID}-${VERSION}.msi > MsrPlayer-${RID}-${VERSION}.msi.sha256)
        done

    # 上传全部产物到 GitHub Release（gh 上传任意文件，不受 vpk 资产类型限制）
    - name: release
      if: github.ref_type == 'tag'
      run: |
        gh release create ${GITHUB_REF_NAME} --generate-notes || true
        gh release upload ${GITHUB_REF_NAME} Releases/* --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
