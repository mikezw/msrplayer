# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-and-release:

    # MSI generation (--msi) requires the WiX 5 toolchain, which is only available on Windows,
    # so this job runs on a Windows runner
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: 10.0
        
    - name: restore dependencies
      # RID-less restore for build/test; per-RID assets are filled by publish's implicit restore
      run: dotnet restore
      
    - name: test
      run: dotnet test --no-restore

    - name: install vpk
      if: github.ref_type == 'tag'
      run: dotnet tool install --global vpk --version 1.2.0

    # Publish two Windows architectures (win-x64 / win-arm64), distinguished by separate channels
    # Per architecture: fetch previous release -> pack -> rename installer (arch+version) -> SHA256
    - name: publish and pack
      if: github.ref_type == 'tag'
      shell: bash
      run: |
        set -e
        export PATH="$PATH:$HOME/.dotnet/tools"
        VERSION=${GITHUB_REF_NAME#v}
        for SPEC in "win-x64:win" "win-arm64:win-arm64"; do
          RID=${SPEC%%:*}
          CHANNEL=${SPEC##*:}

          # publish without --no-restore: the SDK implicitly restores the current RID
          # (sequential 'dotnet restore -r' overwrites each other, cannot be relied on)
          dotnet publish MsrPlayer/MsrPlayer.csproj -o:release/$RID -r:$RID -p:Version=${VERSION}

          # Fetch previous release artifacts for delta updates; ignore failure on first release
          vpk download github --repoUrl https://github.com/mikezw/msrplayer -c ${CHANNEL} || true

          # Code signing (optional): append signing args to the pack command once a cert is ready
          #   Azure Trusted Signing: --azureTrustedSignFile <metadata.json>
          #   Existing cert: --signTemplate "signtool sign /f <cert.pfx> /p <password> {{file}}"
          # No OS directive needed: the runner is Windows, so the target OS already defaults
          # to the current system ([win] was only required for cross-compiling on Linux)
          # --msi --instLocation Either: also generate an MSI installer; the user chooses
          # PerUser/PerMachine scope during installation
          vpk pack --packId MsrPlayer --packVersion ${VERSION} --packDir release/$RID --packTitle "Monster Siren Player" --mainExe MsrPlayer.exe --icon MsrPlayer/Assets/music-icon.ico --runtime ${RID} --channel ${CHANNEL} --msi --instLocation Either

          # Rename installers (arch+version suffix) for user recognition; auto-update is unaffected
          # (update feeds only reference the nupkg)
          mv Releases/MsrPlayer-${CHANNEL}-Setup.exe Releases/MsrPlayer-${RID}-${VERSION}-Setup.exe
          mv Releases/MsrPlayer-${CHANNEL}.msi Releases/MsrPlayer-${RID}-${VERSION}.msi

          # SHA256 only for the installers (Setup.exe / MSI)
          (cd Releases && sha256sum MsrPlayer-${RID}-${VERSION}-Setup.exe > MsrPlayer-${RID}-${VERSION}-Setup.exe.sha256)
          (cd Releases && sha256sum MsrPlayer-${RID}-${VERSION}.msi > MsrPlayer-${RID}-${VERSION}.msi.sha256)
        done

    # Upload all artifacts to the GitHub Release (gh uploads any file, not limited to vpk asset types)
    - name: release
      if: github.ref_type == 'tag'
      shell: bash
      run: |
        gh release create ${GITHUB_REF_NAME} --generate-notes || true
        gh release upload ${GITHUB_REF_NAME} Releases/* --clobber
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
